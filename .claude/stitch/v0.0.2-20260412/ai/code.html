<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Voicelog AI - 녹음</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#f0f4f8",
                    "surface-container": "#eaeef2",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#001551",
                    "on-secondary": "#ffffff",
                    "surface-dim": "#d6dade",
                    "on-primary": "#ffffff",
                    "primary": "#0d46d1",
                    "surface-bright": "#f6fafe",
                    "surface": "#f6fafe",
                    "on-primary-fixed-variant": "#0039b5",
                    "on-background": "#171c1f",
                    "on-surface-variant": "#434655",
                    "on-secondary-container": "#fffbff",
                    "on-primary-container": "#efefff",
                    "secondary": "#4648d4",
                    "on-secondary-fixed": "#07006c",
                    "inverse-primary": "#b7c4ff",
                    "tertiary-fixed-dim": "#4edea3",
                    "secondary-fixed-dim": "#c0c1ff",
                    "on-tertiary-container": "#bdffdb",
                    "tertiary-container": "#007d55",
                    "primary-fixed": "#dce1ff",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#dfe3e7",
                    "primary-container": "#3761ea",
                    "on-error": "#ffffff",
                    "secondary-container": "#6063ee",
                    "background": "#f6fafe",
                    "inverse-surface": "#2c3134",
                    "on-surface": "#171c1f",
                    "primary-fixed-dim": "#b7c4ff",
                    "outline-variant": "#c3c6d7",
                    "surface-container-lowest": "#ffffff",
                    "outline": "#737686",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed": "#002113",
                    "tertiary-fixed": "#6ffbbe",
                    "error": "#ba1a1a",
                    "secondary-fixed": "#e1e0ff",
                    "inverse-on-surface": "#edf1f5",
                    "surface-variant": "#dfe3e7",
                    "surface-tint": "#2151da",
                    "surface-container-high": "#e4e9ed",
                    "on-secondary-fixed-variant": "#2f2ebe",
                    "tertiary": "#006242",
                    "on-tertiary-fixed-variant": "#005236"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Pretendard", "sans-serif"],
                    "body": ["Pretendard", "sans-serif"],
                    "label": ["Pretendard", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Pretendard', sans-serif;
            min-height: max(884px, 100dvh);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .waveform-bar {
            animation: wave 1.2s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { height: 12px; opacity: 0.4; }
            50% { height: 48px; opacity: 1; }
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/70 dark:bg-slate-950/80 backdrop-blur-xl flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">menu</span>
<h1 class="text-xl font-bold tracking-tight text-primary font-headline">Voicelog AI</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white shadow-sm">
<img alt="프로필" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAKAxxlKzJsgAKRXPfQIMBhUUQR7exH_2nI5fIEocrDmoPXLoaRzNt5tUQvLJmZFLhhBKoHQDsJVWVcESdq67mSywMcHgH8pwe44kCAChUb31tbaT8Hk9hgvvvFWdY4lJc3egnMdH8tU7YpHYbJgYmg50xCcPJCKQvZ1arQAyq0rSvclBnxBCMsD8ZR5m_lDVfw4TlbbilQlgj3C4TlWr14dKxiHk9lMIku75B5_jmk_JjLq6Q2dUCScXmkgZXYajsVhXiPf-O4GTX3"/>
</div>
</header>
<main class="relative h-screen w-full flex flex-col items-center justify-start px-6 pt-24 pb-32">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute top-1/4 left-1/4 w-[400px] h-[400px] bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
<!-- Recording State Indicator -->
<div class="z-10 mb-8 flex flex-col items-center text-center">
<div class="flex items-center gap-2 px-5 py-2 bg-error-container/80 text-on-error-container rounded-full text-xs font-bold tracking-wider mb-6 shadow-sm">
<span class="w-2.5 h-2.5 rounded-full bg-error animate-pulse"></span>
                실시간 녹음 중
            </div>
<h2 class="text-3xl md:text-4xl font-extrabold font-headline text-on-surface tracking-tight mb-3">생각을 기록하고 있습니다</h2>
<p class="text-on-surface-variant/80 text-base font-medium">자연스럽게 말씀해 주세요. AI가 경청하고 있습니다.</p>
</div>
<!-- STT Glassmorphic Container -->
<div class="z-10 w-full max-w-2xl glass-morphism rounded-[2.5rem] p-10 mb-10 min-h-[220px] flex items-center justify-center text-center shadow-xl shadow-primary/5">
<p class="text-2xl md:text-3xl leading-[1.6] font-semibold text-on-surface-variant font-headline">
                "생각해보니 서비스 간의 <span class="text-primary bg-primary-fixed/40 px-2 py-0.5 rounded-lg">결합도(Decoupling)</span>를 낮추는 게 확장에 더 유리할 것 같아요. 그래야 유지보수도..."
            </p>
</div>
<!-- AI Status Message -->
<div class="z-10 mb-10 flex items-center gap-3 bg-primary/5 px-4 py-2 rounded-full border border-primary/10">
<span class="material-symbols-outlined text-primary text-xl animate-spin" style="animation-duration: 3s;">auto_awesome</span>
<span class="text-sm font-semibold text-primary/80 tracking-tight">AI 엔진 가동 및 실시간 문맥 분석 중</span>
</div>
<!-- Waveform Visualizer -->
<div class="z-10 flex items-end justify-center gap-2 h-20 mb-12">
<div class="waveform-bar w-2 bg-primary rounded-full" style="animation-delay: 0.1s"></div>
<div class="waveform-bar w-2 bg-primary/60 rounded-full" style="animation-delay: 0.3s"></div>
<div class="waveform-bar w-2 bg-secondary rounded-full" style="animation-delay: 0.2s"></div>
<div class="waveform-bar w-2 bg-primary/80 rounded-full" style="animation-delay: 0.5s"></div>
<div class="waveform-bar w-2 bg-secondary/40 rounded-full" style="animation-delay: 0.4s"></div>
<div class="waveform-bar w-2 bg-primary rounded-full" style="animation-delay: 0.7s"></div>
<div class="waveform-bar w-2 bg-primary/30 rounded-full" style="animation-delay: 0.2s"></div>
<div class="waveform-bar w-2 bg-secondary rounded-full" style="animation-delay: 0.8s"></div>
<div class="waveform-bar w-2 bg-primary/70 rounded-full" style="animation-delay: 0.4s"></div>
<div class="waveform-bar w-2 bg-primary/90 rounded-full" style="animation-delay: 0.6s"></div>
<div class="waveform-bar w-2 bg-secondary/50 rounded-full" style="animation-delay: 0.1s"></div>
<div class="waveform-bar w-2 bg-primary rounded-full" style="animation-delay: 0.3s"></div>
</div>
<!-- Main Recording Interaction -->
<div class="z-10 flex items-center gap-10">
<!-- Cancel -->
<button class="w-16 h-16 rounded-full flex flex-col items-center justify-center text-on-surface-variant bg-surface-container hover:bg-surface-container-highest transition-all duration-300">
<span class="material-symbols-outlined text-2xl">close</span>
<span class="text-[10px] mt-0.5 font-bold">취소</span>
</button>
<!-- Pulse Record Button -->
<div class="relative group">
<div class="absolute inset-0 bg-primary/20 rounded-full animate-ping scale-150 opacity-20"></div>
<div class="absolute inset-0 bg-primary/10 rounded-full animate-ping scale-125 opacity-40" style="animation-delay: 0.5s"></div>
<button class="relative w-32 h-32 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-on-primary shadow-[0_24px_48px_rgba(13,70,209,0.3)] active:scale-95 transition-transform duration-300">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Stop/Finish -->
<button class="w-16 h-16 rounded-full flex flex-col items-center justify-center text-on-primary bg-primary shadow-lg shadow-primary/30 active:scale-95 transition-all duration-300">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">stop</span>
<span class="text-[10px] mt-0.5 font-bold">완료</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-6 pb-8 pt-4 bg-white/80 dark:bg-slate-950/80 backdrop-blur-3xl rounded-t-[3rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-50">
<a class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[11px] font-bold tracking-tight font-headline">홈</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary/10 text-primary rounded-full px-6 py-2 scale-100" href="#">
<span class="material-symbols-outlined" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="text-[11px] font-bold tracking-tight font-headline">녹음</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="insights">insights</span>
<span class="text-[11px] font-bold tracking-tight font-headline">통계</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-[11px] font-bold tracking-tight font-headline">설정</span>
</a>
</nav>
<!-- Processing Overlay (Hidden State Example) -->
<div class="hidden fixed inset-0 z-[60] bg-white/90 backdrop-blur-2xl flex flex-col items-center justify-center">
<div class="w-32 h-32 relative mb-8">
<div class="absolute inset-0 border-4 border-primary/10 rounded-full"></div>
<div class="absolute inset-0 border-4 border-t-primary rounded-full animate-spin"></div>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-primary">auto_awesome</span>
</div>
</div>
<h3 class="text-2xl font-bold font-headline mb-2">AI가 분석 중입니다</h3>
<p class="text-on-surface-variant font-medium">내용을 정리하고 핵심 인사이트를 추출하고 있습니다.</p>
</div>
</body></html>
